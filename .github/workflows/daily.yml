name: Daily air quality run

on:
  schedule:
    - cron: "0 6,12 * * *"  # 06:00 and 12:00 UTC every day (London: 6am and 12pm in winter, 7am and 1pm in summer)
    # The 06:00 run feeds the Copilot Studio daily check at 07:30 UTC. The 12:00 run refreshes the
    # data for chat questions and Streamlit (newer weather forecast; the official index is usually out by then).
  workflow_dispatch:        # adds a "Run workflow" button for testing

permissions:
  contents: write           # lets the run save the file back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore downloaded months from earlier runs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: pip install -r requirements.txt

      - name: Fetch and summarise
        run: python data/summarise.py --fetch

      - name: Copy summary to the public folder
        run: |
          mkdir -p data/latest
          cp data/processed/summary.csv data/latest/summary.csv
          cp data/processed/summary_report.txt data/latest/summary_report.txt
          cp data/processed/daily.csv data/latest/daily.csv

      - name: Wrap the summary and report as JSON for Copilot Studio
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          latest = Path("data/latest")
          csv_text = (latest / "summary.csv").read_text(encoding="utf-8")
          rows = list(csv.DictReader(csv_text.splitlines()))
          date = rows[0]["date"] if rows else ""
          (latest / "summary.json").write_text(json.dumps(
              {"city": "London", "date": date, "summary_csv": csv_text}), encoding="utf-8")
          report = (latest / "summary_report.txt").read_text(encoding="utf-8")
          (latest / "summary_report.json").write_text(json.dumps(
              {"date": date, "report": report}), encoding="utf-8")
          PY

      - name: Forecast today and tomorrow (runs once data/forecast.py exists)
        run: |
          if [ -f data/forecast.py ]; then
            python data/forecast.py
            cp data/processed/forecast.csv data/latest/forecast.csv
            cp data/processed/backtest.csv data/latest/backtest.csv
            cp data/processed/backtest_days.csv data/latest/backtest_days.csv
            python - <<'PY'
          import csv, json
          from pathlib import Path
          latest = Path("data/latest")
          csv_text = (latest / "forecast.csv").read_text(encoding="utf-8")
          rows = list(csv.DictReader(csv_text.splitlines()))
          first = rows[0] if rows else {}
          (latest / "forecast.json").write_text(json.dumps(
              {"city": "London", "made_on": first.get("made_on", ""),
               "based_on_date": first.get("based_on_date", ""), "forecast_csv": csv_text}),
              encoding="utf-8")
          PY
          else
            echo "data/forecast.py not written yet; skipping the forecast"
          fi

      - name: Save today's summary
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/latest/
          git commit -m "Daily summary $(date -u '+%F %H:%M') UTC" || echo "No change"
          git pull --rebase
          git push