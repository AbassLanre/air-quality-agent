name: Daily air quality run

on:
  schedule:
    - cron: "0 6 * * *"     # 06:00 UTC every day
  workflow_dispatch:        # adds a "Run workflow" button for testing

permissions:
  contents: write           # lets the run save the file back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore downloaded months from earlier runs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: pip install -r requirements.txt

      - name: Fetch and summarise
        run: python data/summarise.py --fetch

      - name: Copy summary to the public folder
        run: |
          mkdir -p data/latest
          cp data/processed/summary.csv data/latest/summary.csv
          cp data/processed/summary_report.txt data/latest/summary_report.txt
          cp data/processed/daily.csv data/latest/daily.csv

      - name: Wrap the summary and report as JSON for Copilot Studio
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          latest = Path("data/latest")
          csv_text = (latest / "summary.csv").read_text(encoding="utf-8")
          rows = list(csv.DictReader(csv_text.splitlines()))
          date = rows[0]["date"] if rows else ""
          (latest / "summary.json").write_text(json.dumps(
              {"city": "London", "date": date, "summary_csv": csv_text}), encoding="utf-8")
          report = (latest / "summary_report.txt").read_text(encoding="utf-8")
          (latest / "summary_report.json").write_text(json.dumps(
              {"date": date, "report": report}), encoding="utf-8")
          PY

      - name: Save today's summary
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/latest/
          git commit -m "Daily summary $(date -u +%F)" || echo "No change"
          git pull --rebase
          git push