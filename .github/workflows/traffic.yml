name: Traffic snapshot (more often in rush hour)

# TfL only publishes the current road status, so we save snapshots to build up the history.
# (The daily workflow runs once a day, which is not enough.)
#
# Schedule (all times UTC, always 10 or 40 minutes past because GitHub is busiest on the hour):
#   Rush windows 06:00-09:59 and 15:00-18:59 UTC: every 30 minutes.
#     London local rush hour is 07-10 and 16-19. That is 07-10 / 16-19 UTC in winter (GMT)
#     but 06-09 / 15-18 UTC in summer (BST), so the windows cover both.
#   Rest of the day: 01:10, 04:10, 12:10 and 22:10.
# If you change these times, update POLL_HOURS_UTC in data/fetch.py to match.

on:
  schedule:
    - cron: "10,40 6-9,15-18 * * *"   # rush windows, every 30 minutes
    - cron: "10 1,4,12,22 * * *"      # quiet hours
  workflow_dispatch:                  # adds a "Run workflow" button for testing

permissions:
  contents: write           # lets the run save the history file back to the repo

# Never run two jobs that push to the repo at the same time
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Save TfL road status
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}   # optional; leave the secret unset if not needed
        run: python data/fetch.py --poll

      - name: Commit the history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/traffic/traffic_status.csv
          git commit -m "Traffic snapshot $(date -u +%FT%H:%MZ)" || echo "No change"
          git pull --rebase
          git push
